<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | StayLux</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 15px;
            background: #f4f1eb;
            font-family: Arial, sans-serif;
            color: #102a35;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.06);
        }

        h1 {
            font-family: Georgia, serif;
            margin-top: 0;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input:not([type="checkbox"]),
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        input[type="checkbox"] {
            margin-right: 8px;
        }

        .helptext {
            display: block;
            color: #777;
            font-size: 12px;
            margin-top: 5px;
        }

        .errorlist {
            color: #b91c1c;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #c5a46d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #a98953;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #102a35;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>{{ title }}</h1>

    <p class="subtitle">
        Enter the room information below.
    </p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Room
        </button>
    </form>

    <a href="{% url 'dashboard' %}" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
